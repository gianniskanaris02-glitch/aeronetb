services:
  - type: web
    name: aeronetb-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        value: aeronetb_db
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: aeronetb_mongo
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30m
      - key: ALLOWED_ORIGINS
        value: "*"

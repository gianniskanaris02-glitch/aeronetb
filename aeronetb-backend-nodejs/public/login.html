<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroNetB — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#050a12;--surface:#0b1220;--surface2:#111c2e;--border:#1e3050;
      --accent:#00c8ff;--accent2:#0066ff;--accent3:#00ff88;--danger:#ff3b5c;
      --text:#e8f0ff;--text-dim:#6b8cad;--glow:0 0 20px rgba(0,200,255,0.3);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.03) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite;}
    @keyframes gridMove{0%{transform:translateY(0)}100%{transform:translateY(50px)}}
    .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.15;animation:orbFloat 8s ease-in-out infinite;}
    .orb1{width:400px;height:400px;background:var(--accent2);top:-100px;left:-100px;}
    .orb2{width:300px;height:300px;background:var(--accent);bottom:-50px;right:10%;animation-delay:3s;}
    .orb3{width:200px;height:200px;background:var(--accent3);top:40%;left:60%;animation-delay:6s;}
    @keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
    .login-wrapper{position:relative;z-index:10;width:100%;max-width:440px;padding:20px;}
    .brand{text-align:center;margin-bottom:40px;}
    .brand-logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:16px;}
    .brand-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--glow);}
    .brand-name{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .brand-subtitle{font-size:13px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;font-family:'Share Tech Mono',monospace;}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;position:relative;overflow:hidden;}
    .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);}
    .card-title{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px;letter-spacing:1px;}
    .card-subtitle{font-size:13px;color:var(--text-dim);margin-bottom:32px;}
    .form-group{margin-bottom:20px;}
    label{display:block;font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase;font-family:'Share Tech Mono',monospace;}
    .input-wrapper{position:relative;}
    .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:16px;pointer-events:none;}
    input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 14px 14px 44px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;transition:all 0.2s;outline:none;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,200,255,0.1);}
    input::placeholder{color:var(--text-dim);opacity:0.5;}
    .btn-login{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:10px;color:white;font-size:15px;font-weight:600;font-family:'Rajdhani',sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-top:8px;}
    .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(0,102,255,0.4);}
    .btn-login.loading{opacity:0.7;cursor:not-allowed;}
    .error-msg{display:none;background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--danger);margin-top:16px;text-align:center;}
    .error-msg.show{display:block;}
    .test-creds{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}
    .test-creds-title{font-size:11px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;font-family:'Share Tech Mono',monospace;margin-bottom:12px;text-align:center;}
    .cred-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .cred-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all 0.2s;text-align:left;}
    .cred-btn:hover{border-color:var(--accent);background:rgba(0,200,255,0.05);}
    .cred-role{font-size:11px;color:var(--accent);font-family:'Share Tech Mono',monospace;}
    .cred-user{font-size:13px;color:var(--text);font-weight:500;margin-top:2px;}
    .api-status{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:24px;font-size:12px;color:var(--text-dim);font-family:'Share Tech Mono',monospace;}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent3);box-shadow:0 0 8px var(--accent3);animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">✈</div>
        <div class="brand-name">AERONETB</div>
      </div>
      <div class="brand-subtitle">Aerospace Supply Chain System</div>
    </div>
    <div class="login-card">
      <div class="card-title">Secure Access</div>
      <div class="card-subtitle">Sign in to your account to continue</div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" placeholder="Enter your username" />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Enter your password" />
          </div>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">SIGN IN</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
      <div class="test-creds">
        <div class="test-creds-title">Quick Login — Test Accounts</div>
        <div class="cred-grid">
          <div class="cred-btn" onclick="quickLogin('admin','password123')">
            <div class="cred-role">Administrator</div>
            <div class="cred-user">admin</div>
          </div>
          <div class="cred-btn" onclick="quickLogin('jsmith','password123')">
            <div class="cred-role">Procurement</div>
            <div class="cred-user">jsmith</div>
          </div>
          <div class="cred-btn" onclick="quickLogin('rjohnson','password123')">
            <div class="cred-role">Quality Mgr</div>
            <div class="cred-user">rjohnson</div>
          </div>
          <div class="cred-btn" onclick="quickLogin('wmanager','password123')">
            <div class="cred-role">Warehouse</div>
            <div class="cred-user">wmanager</div>
          </div>
        </div>
      </div>
      <div class="api-status">
        <div class="status-dot"></div>
        <span>API ONLINE — aeronetb-backend.onrender.com</span>
      </div>
    </div>
  </div>
  <script>
    const API = 'https://aeronetb-backend.onrender.com';
    function quickLogin(u,p){
      document.getElementById('username').value=u;
      document.getElementById('password').value=p;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
    document.getElementById('loginForm').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const btn=document.getElementById('loginBtn');
      const err=document.getElementById('errorMsg');
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      if(!username||!password){err.textContent='Please enter username and password.';err.classList.add('show');return;}
      btn.classList.add('loading');btn.textContent='AUTHENTICATING...';err.classList.remove('show');
      try{
        const res=await fetch(`${API}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
        const data=await res.json();
        if(data.success){
          localStorage.setItem('token',data.data.access_token);
          localStorage.setItem('user',JSON.stringify(data.data.user));
          btn.textContent='SUCCESS! Redirecting...';
          setTimeout(()=>window.location.href='dashboard.html',600);
        }else{throw new Error(data.message);}
      }catch(ex){
        err.textContent=ex.message||'Login failed.';err.classList.add('show');
        btn.classList.remove('loading');btn.textContent='SIGN IN';
      }
    });
    if(localStorage.getItem('token'))window.location.href='dashboard.html';
  </script>
</body>
</html>
